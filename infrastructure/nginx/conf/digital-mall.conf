# Digital Mall — Nginx 前端配置
#
# 部署步骤：
# 1. 将 html/digital-mall-portal/ 目录复制到 nginx 的 html 目录下
#    例如：cp -r infrastructure/nginx/html/digital-mall-portal D:/JavaWeb-Project/nginx/hmall-nginx/html/
# 2. 将此 server block 追加到 nginx 的 conf/nginx.conf 中
# 3. 重启 nginx：nginx -s reload
# 4. 访问 http://localhost:18083

server {
    listen       18083;
    server_name  localhost;

    # 前端静态页面
    location / {
        root html/digital-mall-portal;
        index index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }

    # API 反向代理到后端网关（Spring Cloud Gateway 默认 8080）
    location /api {
        rewrite /api/(.*)  /$1 break;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
