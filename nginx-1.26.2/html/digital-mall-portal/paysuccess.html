<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字商城 - 支付成功</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/digital-mall.css">
  <style>
    /* —— 支付成功页专属增强 —— */
    .success-page {
      min-height: calc(100vh - 64px - 60px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 24px 80px;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(16,185,129,.04) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 70%, rgba(255,107,53,.03) 0%, transparent 50%),
        var(--bg);
    }

    .success-icon-wrapper {
      position: relative;
      margin-bottom: 28px;
    }

    /* 外圈脉冲环 */
    .success-ring {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 2px solid rgba(16,185,129,.15);
      animation: ringPulse 1.6s var(--ease) .5s both;
    }
    .success-ring:nth-child(2) {
      inset: -38px;
      border-color: rgba(16,185,129,.08);
      animation-delay: .7s;
    }

    @keyframes ringPulse {
      0%   { transform: scale(.5); opacity: 0; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: .6; }
    }

    /* 图标自身已由 digital-mall.css 的 .success-icon + successBounce 处理 */
    .success-icon {
      position: relative; z-index: 1;
      width: 96px; height: 96px; font-size: 50px;
      box-shadow: 0 8px 32px rgba(16,185,129,.25);
    }

    /* 订单详情卡片 */
    .order-detail-card {
      max-width: 460px; width: 100%;
      margin: 0 auto;
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 32px 36px;
      text-align: left;
      animation: fadeInUp .6s var(--ease) .35s both;
    }

    .order-detail-card .info-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .order-detail-card .info-row:last-child { border-bottom: none; }

    .order-detail-card .info-label {
      font: 500 14px 'Nunito Sans', sans-serif;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 8px;
    }

    .order-detail-card .info-value {
      font: 600 15px 'Nunito Sans', sans-serif;
      color: var(--text);
      text-align: right;
    }
    .order-detail-card .info-value.order-id {
      font-family: 'Nunito Sans', monospace;
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: .5px;
    }

    .order-amount-highlight {
      display: block; text-align: center;
      padding: 20px 0 24px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 4px;
    }
    .order-amount-highlight .label {
      font: 500 13px 'Nunito Sans', sans-serif;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .order-amount-highlight .amount {
      font: 800 44px/1 'Nunito Sans', sans-serif;
      color: var(--primary);
      letter-spacing: -1px;
    }
    .order-amount-highlight .amount::before {
      content: '¥';
      font-size: .45em;
      font-weight: 700;
      vertical-align: super;
      margin-right: 2px;
    }

    /* 按钮组 */
    .success-actions {
      display: flex; gap: 16px; justify-content: center;
      margin-top: 32px; flex-wrap: wrap;
      animation: fadeInUp .6s var(--ease) .55s both;
    }

    @media (max-width: 480px) {
      .success-actions { flex-direction: column; align-items: stretch; }
      .success-actions .btn { width: 100%; }
      .order-detail-card { padding: 24px 20px; }
      .order-amount-highlight .amount { font-size: 36px; }
    }
  </style>
</head>
<body>
<div id="app">
  <top-nav page="paysuccess"></top-nav>

  <div class="success-page">

    <!-- ===== 加载状态 ===== -->
    <template v-if="loading">
      <div class="loading">
        <div class="spinner"></div>
        <p>正在获取订单信息...</p>
      </div>
    </template>

    <!-- ===== 错误状态 ===== -->
    <template v-else-if="errorMsg">
      <div class="success-icon" style="background:linear-gradient(135deg,var(--danger),#F87171);">✗</div>
      <h1 style="margin-bottom:12px;">订单查询失败</h1>
      <p class="detail">{{ errorMsg }}</p>
      <div class="success-actions">
        <a href="/" class="btn btn-primary btn-lg">🏠 返回首页</a>
      </div>
    </template>

    <!-- ===== 成功状态 ===== -->
    <template v-else-if="order">
      <!-- 成功图标 + 脉冲环 -->
      <div class="success-icon-wrapper">
        <div class="success-ring"></div>
        <div class="success-ring"></div>
        <div class="success-icon">✓</div>
      </div>

      <h1 style="margin-bottom:8px;">支付成功！</h1>
      <p class="detail" style="margin-bottom:32px;">
        您的订单已支付成功，我们将尽快为您发货 📦
      </p>

      <!-- 订单详情卡片 -->
      <div class="order-detail-card">
        <!-- 金额高亮 -->
        <div class="order-amount-highlight">
          <div class="label">支付金额</div>
          <div class="amount">{{ util.formatPrice(order.totalAmount) }}</div>
        </div>

        <!-- 订单信息行 -->
        <div class="info-row">
          <span class="info-label">📋 订单编号</span>
          <span class="info-value order-id">{{ order.id || order.orderNo }}</span>
        </div>
        <div class="info-row" v-if="order.paymentMethod || order.payMethod">
          <span class="info-label">💳 支付方式</span>
          <span class="info-value">{{ order.paymentMethod || order.payMethod }}</span>
        </div>
        <div class="info-row" v-if="order.createTime || order.payTime">
          <span class="info-label">🕐 支付时间</span>
          <span class="info-value">{{ formatTime(order.createTime || order.payTime) }}</span>
        </div>
        <div class="info-row" v-if="order.statusDesc || orderStatusText">
          <span class="info-label">📌 订单状态</span>
          <span class="info-value" style="color:var(--success);">{{ order.statusDesc || orderStatusText }}</span>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="success-actions">
        <button class="btn btn-outline btn-lg" @click="viewOrder">
          📋 查看订单
        </button>
        <a href="/" class="btn btn-primary btn-lg">
          🛒 继续购物
        </a>
      </div>
    </template>

  </div>

  <footer class="footer">
    <p>&copy; 2026 数字商城 Digital Mall. All rights reserved.</p>
  </footer>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script src="js/top.js"></script>
<script>
const { createApp } = Vue
createApp({
  data() {
    return {
      order: null,
      loading: true,
      errorMsg: ''
    }
  },
  computed: {
    orderStatusText() {
      if (!this.order) return '';
      var map = {
        'paid': '已支付',
        'PAID': '已支付',
        'shipped': '已发货',
        'SHIPPED': '已发货',
        'delivered': '已签收',
        'DELIVERED': '已签收',
        'completed': '已完成',
        'COMPLETED': '已完成',
        'pending': '待支付',
        'PENDING': '待支付'
      };
      return map[this.order.status] || '';
    }
  },
  methods: {
    fetchOrder(orderId) {
      var self = this;
      self.loading = true;
      self.errorMsg = '';

      axios.get('/orders/' + orderId)
        .then(function (res) {
          self.loading = false;
          // Result<T> 统一返回: { code:200, msg:"OK", data:OrderVO }
          var data = (res && res.data) ? res.data : null;
          if (!data) {
            self.errorMsg = '订单信息异常，请联系客服';
            return;
          }
          self.order = data;
        })
        .catch(function (err) {
          self.loading = false;
          var resp = err.response;
          if (!resp) {
            self.errorMsg = '网络异常，请检查网络连接后刷新页面';
            return;
          }
          var status = resp.status;
          if (status === 404) {
            self.errorMsg = '未找到该订单，请确认订单号是否正确';
          } else if (status === 401) {
            self.errorMsg = '请先登录后再查看订单';
          } else if (resp.data && (resp.data.msg || resp.data.message)) {
            self.errorMsg = resp.data.msg || resp.data.message;
          } else {
            self.errorMsg = '获取订单信息失败，请稍后重试';
          }
        });
    },

    formatTime(timeStr) {
      if (!timeStr) return '';
      try {
        var d = new Date(timeStr);
        if (isNaN(d.getTime())) return timeStr;
        var y = d.getFullYear();
        var M = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        var h = String(d.getHours()).padStart(2, '0');
        var m = String(d.getMinutes()).padStart(2, '0');
        var s = String(d.getSeconds()).padStart(2, '0');
        return y + '-' + M + '-' + day + ' ' + h + ':' + m + ':' + s;
      } catch (e) {
        return timeStr;
      }
    },

    viewOrder() {
      if (!this.order) return;
      var orderId = this.order.id || this.order.orderNo;
      if (orderId) {
        location.href = '/orders.html?id=' + encodeURIComponent(orderId);
      }
    }
  },
  mounted() {
    var orderId = util.getUrlParam('orderId');
    if (!orderId) {
      this.loading = false;
      this.errorMsg = '缺少订单编号参数';
      return;
    }
    this.fetchOrder(orderId);
  }
}).component('top-nav', TopNav).mount('#app')
</script>
</body>
</html>
