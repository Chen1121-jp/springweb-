<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字商城 - 登录</title>
  <link rel="stylesheet" href="css/digital-mall.css">
</head>
<body>
<div id="app">
  <top-nav page="login"></top-nav>

  <div class="login-page">
    <div class="login-card">
      <div class="text-center mb-24">
        <div class="logo-icon" style="display:inline-flex;width:56px;height:56px;font-size:28px;">D</div>
        <h2 style="margin-top:16px;">数字商城</h2>
        <p style="color:var(--text-light);font-size:14px;margin-top:8px;">欢迎回来，请登录您的账号</p>
      </div>

      <div v-if="errorMsg" class="alert alert-error" style="text-align:center;">
        ⚠️ {{ errorMsg }}
      </div>

      <div class="form-group">
        <label class="form-label">👤 用户名</label>
        <input
          type="text"
          class="input input-lg"
          v-model="username"
          placeholder="请输入用户名"
          autocomplete="username"
          @keyup.enter="login"
          @input="errorMsg = ''"
        >
      </div>

      <div class="form-group">
        <label class="form-label">🔒 密码</label>
        <input
          type="password"
          class="input input-lg"
          v-model="password"
          placeholder="请输入密码"
          autocomplete="current-password"
          @keyup.enter="login"
          @input="errorMsg = ''"
        >
      </div>

      <button
        class="btn btn-primary btn-lg btn-block"
        @click="login"
        :disabled="loading"
        style="margin-top:12px;font-size:16px;letter-spacing:4px;"
      >
        <span v-if="loading" class="spinner" style="width:18px;height:18px;border-width:2px;margin:0 8px 0 0;display:inline-block;vertical-align:middle;"></span>
        {{ loading ? '登录中...' : '登 录' }}
      </button>

      <p class="text-center mt-24" style="font-size:13px;color:var(--text-light);">
        还没有账号？
        <a href="/register.html" style="color:var(--primary);font-weight:600;">立即注册 ↗</a>
      </p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 数字商城 Digital Mall. All rights reserved.</p>
  </footer>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script src="js/top.js"></script>
<script>
const { createApp } = Vue
createApp({
  data() {
    return {
      username: '',
      password: '',
      errorMsg: '',
      loading: false
    }
  },
  methods: {
    login() {
      this.errorMsg = '';

      if (!this.username.trim()) {
        this.errorMsg = '请输入用户名';
        return;
      }
      if (!this.password) {
        this.errorMsg = '请输入密码';
        return;
      }

      this.loading = true;

      axios.post('/users/login', {
        username: this.username.trim(),
        password: this.password
      })
      .then(function (res) {
        // Result<T> 统一返回: { code, msg, data: UserLoginVO }
        sessionStorage.setItem('token', res.data.token);
        util.store.set('user-info', { userId: res.data.userId, username: res.data.username, balance: res.data.balance });

        var returnUrl = sessionStorage.getItem('return-url') || '/';
        sessionStorage.removeItem('return-url');
        location.href = returnUrl;
      })
      .catch(function (err) {
        this.loading = false;

        var resp = err.response;
        if (!resp) {
          this.errorMsg = '网络异常，请检查网络连接';
          return;
        }

        var status = resp.status;
        if (status === 400) {
          this.errorMsg = '用户名或密码错误';
        } else if (status === 403) {
          this.errorMsg = '账号已被禁用，请联系管理员';
        } else if (status === 429) {
          this.errorMsg = '登录过于频繁，请稍后再试';
        } else if (resp.data && (resp.data.msg || resp.data.message)) {
          this.errorMsg = resp.data.msg || resp.data.message;
        } else {
          this.errorMsg = '登录失败，请稍后重试';
        }
      }.bind(this));
    }
  },
  mounted() {
    if (util.isLogin()) {
      location.href = '/';
    }
  }
}).component('top-nav', TopNav).mount('#app')
</script>
</body>
</html>
