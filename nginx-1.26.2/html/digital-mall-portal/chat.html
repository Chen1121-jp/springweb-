<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 客服 - 数字商城</title>
  <link rel="stylesheet" href="css/digital-mall.css">
  <style>
    .chat-page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 64px);
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .chat-header {
      text-align: center;
      padding: 20px 0 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .chat-header h2 { font-size: 22px; margin-bottom: 4px; }
    .chat-header p  { font-size: 13px; color: var(--text-light); }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* --- 消息气泡 --- */
    .msg-row { display: flex; gap: 10px; max-width: 85%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ai    { align-self: flex-start; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .msg-row.user .msg-avatar { background: var(--primary-light); }
    .msg-row.ai   .msg-avatar { background: linear-gradient(135deg, var(--accent), #34D399); }

    .msg-bubble {
      padding: 12px 16px; border-radius: 16px;
      font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-row.user .msg-bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.ai .msg-bubble {
      background: var(--card);
      border: 1px solid var(--border-light);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    /* AI 打字光标 */
    .typing-cursor::after {
      content: '▍';
      animation: blink 1s step-end infinite;
      color: var(--primary);
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* --- 欢迎提示 --- */
    .welcome-hint {
      align-self: center; text-align: center;
      padding: 40px 20px; color: var(--text-light);
    }
    .welcome-hint .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome-hint p { font-size: 14px; }

    /* --- 快捷问题 --- */
    .quick-questions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 12px;
    }
    .quick-q {
      padding: 6px 14px; border-radius: 20px;
      background: var(--primary-light); color: var(--primary-dark);
      font: 500 13px 'Nunito Sans', sans-serif;
      cursor: pointer; border: none;
      transition: all .2s var(--ease);
    }
    .quick-q:hover { background: var(--primary-dim); }

    /* --- 输入区 --- */
    .chat-input-area {
      display: flex; gap: 10px; padding: 16px 0;
      border-top: 1px solid var(--border-light);
    }
    .chat-input-area input {
      flex: 1; padding: 12px 16px;
      border: 1.5px solid var(--border); border-radius: 24px;
      font: 500 14px 'Nunito Sans', sans-serif; color: var(--text);
      outline: none; transition: all .2s var(--ease);
    }
    .chat-input-area input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,107,53,.08);
    }
    .chat-input-area input::placeholder { color: var(--text-light); }
    .chat-input-area button {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #FF8D5C);
      color: #fff; border: none; font-size: 18px; cursor: pointer;
      flex-shrink: 0;
      transition: all .25s var(--ease);
      box-shadow: 0 4px 14px rgba(255,107,53,.3);
    }
    .chat-input-area button:hover { transform: scale(1.05); }
    .chat-input-area button:disabled {
      opacity: .4; cursor: not-allowed; transform: none;
    }

    /* --- 加载小点 --- */
    .loading-dots { display: flex; gap: 4px; padding: 4px 0; }
    .loading-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-light);
      animation: dotBounce 1.4s ease-in-out infinite both;
    }
    .loading-dots span:nth-child(2) { animation-delay: .16s; }
    .loading-dots span:nth-child(3) { animation-delay: .32s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .tool-status-text {
      font-size: 13px; color: var(--primary);
      display: flex; align-items: center; gap: 6px;
    }
    .tool-status-text::before {
      content: '\23F3';
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .msg-row { max-width: 92%; }
    }
  </style>
</head>
<body>
<div id="app">
  <top-nav page="chat"></top-nav>

  <div class="chat-page">
    <div class="chat-header">
      <h2>🤖 小电 · AI 客服</h2>
      <p>问商品、查订单、聊优惠，我都在线~</p>
    </div>

    <!-- 消息列表 -->
    <div class="chat-messages" ref="msgBox">
      <!-- 欢迎语 -->
      <div class="welcome-hint" v-if="messages.length === 0">
        <div class="icon">🤖</div>
        <p>你好！我是小电，有什么可以帮你的？</p>
        <div class="quick-questions">
          <button class="quick-q" @click="quickAsk('你们这里卖什么手机？')">📱 有什么手机？</button>
          <button class="quick-q" @click="quickAsk('最近有什么优惠活动？')">🎁 优惠活动</button>
          <button class="quick-q" @click="quickAsk('如何退换货？')">📦 退换货</button>
        </div>
      </div>

      <!-- 消息气泡 -->
      <div class="msg-row" :class="msg.role" v-for="(msg, i) in messages" :key="i">
        <div class="msg-avatar">{{ msg.role === 'user' ? '👤' : '🤖' }}</div>
        <div class="msg-bubble" :class="{ 'typing-cursor': msg.streaming }">{{ msg.content }}</div>
      </div>

      <!-- AI 正在查询 -->
      <div class="msg-row ai" v-if="aiThinking">
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble">
          <span v-if="toolStatus" class="tool-status-text">{{ toolStatus }}</span>
          <div v-else class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- 输入框 -->
    <div class="chat-input-area">
      <input
        type="text"
        v-model="inputText"
        placeholder="输入你的问题..."
        @keyup.enter="send"
        :disabled="sending"
      >
      <button @click="send" :disabled="sending">➤</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script src="js/top.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      messages: [],
      inputText: '',
      sending: false,
      aiThinking: false,
      toolStatus: '',
      conversationId: ''
    };
  },

  mounted() {
    // 从 sessionStorage 复用会话 ID，同一个标签页内保持记忆
    this.conversationId = sessionStorage.getItem('chat-conv-id');
    if (!this.conversationId) {
      this.conversationId = 'chat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      sessionStorage.setItem('chat-conv-id', this.conversationId);
    }
    this.scrollBottom();
  },

  methods: {
    quickAsk(question) {
      this.inputText = question;
      this.send();
    },

    guessToolStatus(text) {
      if (text.includes('订单') || text.includes('物流')) {
        this.toolStatus = '正在查询订单信息…';
      } else if (text.includes('手机') || text.includes('商品') || text.includes('推荐')) {
        this.toolStatus = '正在搜索商品信息…';
      } else {
        this.toolStatus = '正在查询中…';
      }
    },

    send() {
      var text = this.inputText.trim();
      if (!text || this.sending) return;

      this.inputText = '';
      this.sending = true;
      this.aiThinking = true;

      // 显示用户消息
      this.messages.push({ role: 'user', content: text });
      this.guessToolStatus(text);

      // 开始 AI 回复（流式占位）
      this.messages.push({ role: 'ai', content: '', streaming: true });
      var aiMsg = this.messages[this.messages.length - 1];
      this.scrollBottom();

      var self = this;

      // 用 fetch 发 POST，读流式响应
      var headers = { 'Content-Type': 'application/json' };
      var token = sessionStorage.getItem('token');
      if (token) headers['authorization'] = token;

      fetch('/api/chat/smart-stream', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ message: text })
      }).then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);

        self.aiThinking = false;
        var reader = response.body.getReader();
        var decoder = new TextDecoder();

        function read() {
          reader.read().then(function(result) {
            if (result.done) {
              // 流结束
              aiMsg.streaming = false;
              self.sending = false;
              self.toolStatus = '';
              self.scrollBottom();
              return;
            }

            var chunk = decoder.decode(result.value, { stream: true });
            aiMsg.content += chunk;
            self.scrollBottom();
            read();  // 继续读下一段
          }).catch(function(err) {
            console.error('Read error:', err);
            aiMsg.content = aiMsg.content || '抱歉，回复出错了...';
            aiMsg.streaming = false;
            self.sending = false;
            self.toolStatus = '';
          });
        }

        read();
      }).catch(function(err) {
        console.error('Fetch error:', err);
        self.aiThinking = false;
        self.sending = false;
        self.toolStatus = '';
        // 流式失败，降级到非流式
        self.fallbackChat(text, aiMsg);
      });
    },

    // 流式不可用时的降级方案
    fallbackChat(text, aiMsg) {
      var self = this;
      axios.post('/api/chat/simple', { message: text }).then(function(res) {
        var payload = res.data;
        aiMsg.content = (payload && payload.data) ? payload.data : (payload || '');
        aiMsg.streaming = false;
      }).catch(function() {
        aiMsg.content = '抱歉，客服系统暂时不可用，请稍后再试。';
        aiMsg.streaming = false;
      });
    },

    scrollBottom() {
      var self = this;
      this.$nextTick(function() {
        var box = self.$refs.msgBox;
        if (box) box.scrollTop = box.scrollHeight;
      });
    }
  }
}).component('top-nav', TopNav).mount('#app');
</script>
</body>
</html>
