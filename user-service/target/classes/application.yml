server:
  port: 8083

spring:
  application:
    name: user-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${dm.db.host:localhost}:5432/digital_mall?currentSchema=user
    driver-class-name: org.postgresql.Driver
    username: ${dm.db.username:postgres}
    password: ${dm.db.password:123456}
  cloud:
    nacos:
      server-addr: ${dm.nacos.host:localhost}:8848

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: assign_id

logging:
  level:
    com.digital.mall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

dm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
